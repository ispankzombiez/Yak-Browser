
name: Android Release Build
permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare a new build release
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\)[[:space:]]*$/\1/p' app/build.gradle.kts)
          if [[ -z "$VERSION_NAME" || ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not read a valid versionName and versionCode from app/build.gradle.kts."
            exit 1
          fi
          RELEASE_TAG="v${VERSION_NAME}-build${VERSION_CODE}"
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::The app version produces an invalid release tag."
            exit 1
          fi
          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/*-build${VERSION_CODE}")
          if [[ -n "$EXISTING_TAG" ]]; then
            echo "::error::Android version code $VERSION_CODE already has a release tag. Bump versionCode before publishing another build."
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=yakbrowser-${RELEASE_TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > app/yakbrowser-release.jks
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Create signing properties
        run: |
          echo "RELEASE_STORE_FILE=yakbrowser-release.jks" > signing.properties
          echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> signing.properties
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> signing.properties
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> signing.properties

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease

      - name: Rename APK with version and build number
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$APK_NAME"

      - name: Publish new build release as Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: YakBrowser v${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.version_code }})
          body: Automated release of YakBrowser version ${{ steps.version.outputs.version_name }} APK (Android version code ${{ steps.version.outputs.version_code }}).
          draft: false
          prerelease: false
          make_latest: "true"
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/${{ steps.version.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
